<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜀运成都 · 在天府之国，把日子过成好签</title>
<meta name="description" content="蜀运成都：成都文化路线、成都味、趣味蜀运抽签，带你在天府之国把日子过成好签。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23B23A2C'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%23F7F1E5' font-family='serif'%3E%E7%A6%8F%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   设计 Token：朱砂红 / 竹青 / 暖米白 / 墨色 / 鎏金
   ============================================================ */
:root{
  --cinnabar:#B23A2C;
  --cinnabar-deep:#8E2A20;
  --cinnabar-soft:#F5D9CF;
  --bamboo:#6E8F6E;
  --bamboo-deep:#4F6F52;
  --bamboo-soft:#DCE7D8;
  --rice:#F7F1E5;
  --rice-deep:#EFE6D3;
  --paper:#FFFDF8;
  --ink:#2C2A25;
  --ink-soft:#5C574C;
  --gold:#C7A04F;
  --gold-soft:#F2E6C8;
  --shadow-sm:0 2px 10px rgba(44,42,37,.07);
  --shadow-md:0 10px 28px rgba(44,42,37,.12);
  --shadow-lg:0 20px 48px rgba(44,42,37,.18);
  --radius:18px;
  --container:1240px;
  --header-h:70px;
  --font-serif:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","SimSun",serif;
  --font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-sans);
  color:var(--ink);
  background:var(--rice);
  line-height:1.75;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
ul{list-style:none;}
img{display:block;max-width:100%;}
.container{width:100%;max-width:var(--container);margin:0 auto;padding:0 32px;}
::selection{background:var(--cinnabar);color:#fff;}

/* ============================================================
   顶部导航
   ============================================================ */
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(247,241,229,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(44,42,37,.08);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:var(--header-h);}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--font-serif);font-weight:700;font-size:21px;letter-spacing:3px;}
.brand-seal{width:35px;height:35px;border-radius:9px;background:var(--cinnabar);color:var(--rice);display:grid;place-items:center;font-size:18px;font-family:var(--font-serif);box-shadow:0 3px 8px rgba(178,58,44,.3);}
.main-nav{display:flex;gap:4px;}
.nav-link{
  position:relative;overflow:hidden;
  padding:9px 20px;border-radius:999px;font-size:15px;letter-spacing:1px;
  color:var(--ink-soft);transition:background .25s ease,color .25s ease;
}
.nav-link .ripple{background:rgba(178,58,44,.2);}
.nav-link.active .ripple{background:rgba(255,255,255,.4);}
.nav-link:hover{color:var(--cinnabar);}
.nav-link.active{background:var(--cinnabar);color:#fff;box-shadow:0 4px 12px rgba(178,58,44,.28);}
.nav-toggle{display:none;width:44px;height:44px;border-radius:10px;place-items:center;}
.nav-toggle svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;}

/* ============================================================
   按钮 + 涟漪
   ============================================================ */
.btn{
  position:relative;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 34px;border-radius:999px;
  font-size:16px;letter-spacing:2px;white-space:nowrap;
  transition:transform .12s ease,box-shadow .2s ease,filter .2s ease,background .2s ease,color .2s ease;
}
.btn .ripple{background:rgba(255,255,255,.45);}
.btn-primary{background:var(--cinnabar);color:#fff;box-shadow:0 6px 18px rgba(178,58,44,.3);}
.btn-primary:hover{filter:brightness(1.07);box-shadow:0 10px 24px rgba(178,58,44,.36);}
.btn-light{background:var(--paper);color:var(--ink);box-shadow:0 6px 18px rgba(44,42,37,.15);}
.btn-light:hover{filter:brightness(.98);box-shadow:0 10px 24px rgba(44,42,37,.2);}
.btn-ghost{border:1.5px solid var(--paper);color:var(--paper);background:transparent;}
.btn-ghost .ripple{background:rgba(255,255,255,.3);}
.btn-ghost:hover{background:rgba(255,255,255,.14);}
.btn-dark{background:var(--ink);color:var(--rice);box-shadow:0 6px 18px rgba(44,42,37,.25);}
.btn-dark:hover{filter:brightness(1.18);box-shadow:0 10px 24px rgba(44,42,37,.32);}
.btn-lg{padding:16px 44px;font-size:17px;}
.btn:active{transform:scale(.98);}
.ripple{position:absolute;border-radius:50%;transform:scale(0);pointer-events:none;animation:rippleAnim .45s ease-out forwards;}
@keyframes rippleAnim{to{transform:scale(2.6);opacity:0;}}

/* ============================================================
   首页 Hero
   ============================================================ */
.home-hero{
  position:relative;min-height:100vh;min-height:100svh;
  display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--paper);overflow:hidden;
}
.home-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.home-hero-mask{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(44,42,37,.35) 0%,rgba(44,42,37,.18) 40%,rgba(44,42,37,.62) 100%);
}
.home-hero-inner{position:relative;z-index:2;max-width:880px;padding:0 24px;}
.home-hero-eyebrow{
  display:inline-block;padding:7px 22px;border:1px solid rgba(255,253,248,.75);
  border-radius:999px;font-size:14px;letter-spacing:5px;margin-bottom:28px;
  background:rgba(44,42,37,.18);backdrop-filter:blur(4px);
}
.home-hero-title{
  font-family:var(--font-serif);font-weight:900;
  font-size:clamp(48px,7.5vw,92px);letter-spacing:16px;text-indent:16px;
  text-shadow:0 6px 28px rgba(0,0,0,.4);
}
.home-hero-sub{
  font-size:clamp(16px,2vw,21px);letter-spacing:4px;margin-top:16px;
  text-shadow:0 3px 14px rgba(0,0,0,.4);
}
.home-hero-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:46px;}
.home-hero-scroll{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;
  color:rgba(255,253,248,.85);font-size:13px;letter-spacing:3px;
}
.home-hero-scroll::after{
  content:"";display:block;width:1px;height:34px;margin:8px auto 0;
  background:linear-gradient(180deg,rgba(255,253,248,.9),transparent);
  animation:scrollHint 1.8s ease-in-out infinite;
}
@keyframes scrollHint{0%,100%{opacity:.3;transform:scaleY(.7);transform-origin:top;}50%{opacity:1;transform:scaleY(1);}}

/* ============================================================
   通用区块
   ============================================================ */
.section{padding:96px 0;}
.section-head{text-align:center;margin-bottom:56px;}
.section-eyebrow{font-size:13px;letter-spacing:5px;color:var(--cinnabar);display:block;margin-bottom:12px;}
.section-title{
  display:inline-flex;align-items:center;gap:18px;
  font-family:var(--font-serif);font-weight:700;
  font-size:clamp(27px,3.2vw,39px);letter-spacing:5px;
}
.section-title::before,.section-title::after{
  content:"";width:42px;height:2px;background:linear-gradient(90deg,transparent,var(--cinnabar));
}
.section-title::after{background:linear-gradient(90deg,var(--cinnabar),transparent);}
.section-desc{margin-top:14px;color:var(--ink-soft);font-size:16px;letter-spacing:1px;}

/* 今日蜀运短句 */
.today-lines{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:1040px;margin:0 auto;}
.today-line{
  background:var(--paper);border-radius:16px;padding:26px 26px;box-shadow:var(--shadow-sm);
  display:flex;gap:14px;align-items:flex-start;text-align:left;
  transition:transform .18s ease,box-shadow:.18s ease;
}
.today-line .tl-emoji{
  flex-shrink:0;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  font-size:23px;background:var(--gold-soft);
}
.today-line p{font-size:14.5px;color:var(--ink-soft);}
.today-line strong{color:var(--ink);}

/* ============================================================
   卡片网格（蜀迹 / 成都味）
   ============================================================ */
.card-grid{display:grid;gap:26px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.content-card{
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  transition:transform .18s ease,box-shadow .18s ease;
}
.content-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);}
.card-img-wrap{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--rice-deep);}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
.content-card:hover .card-img-wrap img{transform:scale(1.05);}
.card-body{padding:22px 24px 25px;display:flex;flex-direction:column;flex:1;}
.card-title{font-family:var(--font-serif);font-size:21px;letter-spacing:2px;}
.card-tagline{font-size:13.5px;color:var(--cinnabar);letter-spacing:1px;margin-top:3px;}
.card-text{font-size:14px;color:var(--ink-soft);margin-top:10px;flex:1;}
.card-foot{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card-pill{
  font-size:12.5px;color:var(--bamboo-deep);background:rgba(110,143,110,.15);
  padding:5px 13px;border-radius:999px;letter-spacing:1px;
}
.card-more{font-size:13.5px;color:var(--cinnabar);letter-spacing:1px;display:inline-flex;align-items:center;gap:5px;}
.card-more::after{content:"→";transition:transform .2s ease;}
.content-card:hover .card-more::after{transform:translateX(4px);}
.stars{color:var(--cinnabar);letter-spacing:2px;font-size:14.5px;}
.stars .off{color:rgba(44,42,37,.22);}

/* ============================================================
   列表页顶部 Banner
   ============================================================ */
.page-banner{
  position:relative;padding:calc(var(--header-h) + 84px) 0 72px;
  color:var(--paper);text-align:center;overflow:hidden;
}
.page-banner-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.page-banner-mask{position:absolute;inset:0;z-index:1;background:rgba(44,42,37,.58);}
.page-banner-inner{position:relative;z-index:2;}
.page-banner h1{font-family:var(--font-serif);font-size:clamp(32px,4.4vw,50px);letter-spacing:8px;text-indent:8px;}
.page-banner p{margin-top:14px;font-size:16px;letter-spacing:2px;opacity:.92;}

/* ============================================================
   详情页
   ============================================================ */
.detail-hero{position:relative;aspect-ratio:21/9;min-height:320px;overflow:hidden;display:flex;align-items:flex-end;}
.detail-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.detail-hero-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(44,42,37,.12) 30%,rgba(44,42,37,.72) 100%);}
.detail-hero-inner{position:relative;z-index:2;color:var(--paper);padding:0 0 40px;}
.detail-hero h1{font-family:var(--font-serif);font-size:clamp(30px,4vw,48px);letter-spacing:7px;text-indent:7px;text-shadow:0 4px 18px rgba(0,0,0,.4);}
.detail-hero p{font-size:16px;letter-spacing:3px;opacity:.94;text-shadow:0 2px 10px rgba(0,0,0,.4);}
.breadcrumb{padding:18px 0 0;font-size:13px;letter-spacing:1px;color:var(--ink-soft);}
.breadcrumb a{color:var(--ink-soft);transition:color .2s;}
.breadcrumb a:hover{color:var(--cinnabar);}
.breadcrumb span{margin:0 9px;opacity:.5;}
.breadcrumb .current{color:var(--ink);}

.detail-intro{font-size:17px;color:var(--ink);line-height:1.9;}
.detail-intro .lead{font-size:18px;}
.fact-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(44,42,37,.12);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
.fact-item{background:var(--paper);padding:22px 24px;}
.fact-label{font-size:12.5px;letter-spacing:2px;color:var(--ink-soft);display:block;margin-bottom:6px;}
.fact-value{font-size:14.5px;color:var(--ink);font-weight:500;}

.detail-block{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;margin-bottom:72px;}
.detail-block.reverse .block-media{order:2;}
.block-media img{width:100%;border-radius:var(--radius);box-shadow:var(--shadow-md);aspect-ratio:4/3;object-fit:cover;}
.block-text h3{font-family:var(--font-serif);font-size:24px;letter-spacing:3px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}
.block-text h3::before{content:"";width:8px;height:22px;background:var(--cinnabar);border-radius:2px;display:inline-block;}
.block-text p{color:var(--ink-soft);font-size:15.5px;margin-bottom:12px;}

.yun-card{
  position:relative;background:linear-gradient(135deg,var(--cinnabar),var(--cinnabar-deep));
  color:var(--paper);border-radius:var(--radius);padding:40px 44px;
  box-shadow:0 16px 40px rgba(178,58,44,.3);overflow:hidden;
}
.yun-card::after{
  content:"签";position:absolute;right:24px;bottom:-26px;font-family:var(--font-serif);
  font-size:150px;opacity:.08;line-height:1;
}
.yun-card .yun-label{font-size:13px;letter-spacing:5px;opacity:.85;}
.yun-card h3{font-family:var(--font-serif);font-size:26px;letter-spacing:4px;margin:8px 0 10px;}
.yun-card p{font-size:15.5px;opacity:.94;max-width:760px;}

.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}

/* ============================================================
   抽签页
   ============================================================ */
.fortune-wrap{max-width:740px;margin:0 auto;text-align:center;}
.fortune-hint{color:var(--ink-soft);font-size:15.5px;margin:6px 0 30px;letter-spacing:1px;}
.fortune-card{
  position:relative;text-align:left;margin-top:36px;
  background:var(--paper);border-radius:20px;padding:36px 38px 30px;box-shadow:var(--shadow-md);
}
.fortune-card::before{
  content:"";position:absolute;top:0;left:30px;right:30px;height:5px;
  background:linear-gradient(90deg,var(--cinnabar),var(--gold),var(--cinnabar));border-radius:0 0 4px 4px;
}
.fortune-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px dashed rgba(44,42,37,.2);padding-bottom:16px;margin-top:6px;}
.fortune-no{font-size:13px;color:var(--ink-soft);letter-spacing:2px;display:block;}
.fortune-title{font-family:var(--font-serif);font-size:26px;letter-spacing:2px;margin-top:2px;}
.fortune-level{
  flex-shrink:0;font-family:var(--font-serif);font-size:16px;letter-spacing:2px;
  color:#fff;background:var(--cinnabar);border-radius:999px;padding:6px 18px;box-shadow:0 4px 10px rgba(178,58,44,.3);
}
.yiji{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0;}
.yiji-box{border-radius:14px;padding:15px 18px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start;}
.yiji-box strong{font-family:var(--font-serif);font-size:18px;flex-shrink:0;line-height:1.6;}
.yi-box{background:rgba(110,143,110,.13);}
.yi-box strong{color:var(--bamboo-deep);}
.ji-box{background:rgba(178,58,44,.1);}
.ji-box strong{color:var(--cinnabar);}
.cd-talk{background:var(--rice);border-left:3px solid var(--cinnabar);border-radius:0 12px 12px 0;padding:13px 18px;font-size:14.5px;}
.cd-talk strong{color:var(--cinnabar);font-family:var(--font-serif);}
.fortune-advice{margin-top:16px;font-size:14.5px;color:var(--ink-soft);}
.fortune-advice strong{color:var(--ink);font-family:var(--font-serif);}
.fortune-show{animation:fortuneIn .35s ease;}
@keyframes fortuneIn{from{opacity:0;transform:scale(.92) rotateY(12deg);}to{opacity:1;transform:scale(1) rotateY(0);}}
.fortune-note{margin-top:22px;font-size:13px;color:var(--ink-soft);opacity:.75;}

/* ============================================================
   页脚 + 页面切换 + 焦点 + 滚动揭示
   ============================================================ */
.site-footer{background:var(--ink);color:rgba(247,241,229,.72);padding:56px 0 36px;letter-spacing:1px;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;margin-bottom:36px;text-align:left;}
.footer-brand{font-family:var(--font-serif);font-size:22px;color:var(--rice);letter-spacing:4px;display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.footer-grid p{font-size:13.5px;line-height:1.9;}
.footer-grid h4{font-size:14px;color:var(--rice);letter-spacing:3px;margin-bottom:12px;font-family:var(--font-serif);}
.footer-grid a{display:block;font-size:13.5px;padding:4px 0;transition:color .2s;}
.footer-grid a:hover{color:var(--gold);}
.footer-bottom{border-top:1px solid rgba(247,241,229,.14);padding-top:22px;text-align:center;font-size:12.5px;}
:focus-visible{outline:2.5px solid var(--cinnabar);outline-offset:3px;border-radius:8px;}
.view-enter{animation:viewEnter .4s ease;}
@keyframes viewEnter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease;}
.reveal.in-view{opacity:1;transform:translateY(0);}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:1024px){
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .today-lines{grid-template-columns:1fr;max-width:620px;}
  .fact-bar{grid-template-columns:repeat(2,1fr);}
  .related-grid{grid-template-columns:repeat(2,1fr);}
  .section{padding:78px 0;}
  .footer-grid{grid-template-columns:1fr 1fr;}
}
@media (max-width:768px){
  .container{padding:0 20px;}
  .nav-toggle{display:grid;}
  .main-nav{
    position:fixed;top:var(--header-h);left:0;right:0;flex-direction:column;gap:4px;
    background:rgba(247,241,229,.98);backdrop-filter:blur(14px);
    padding:14px 20px 22px;border-bottom:1px solid rgba(44,42,37,.1);
    box-shadow:var(--shadow-md);transform:translateY(-150%);transition:transform .3s ease;
  }
  .main-nav.open{transform:translateY(0);}
  .nav-link{padding:13px 18px;font-size:16px;}
  .grid-3,.grid-4{grid-template-columns:1fr;max-width:480px;margin-left:auto;margin-right:auto;}
  .related-grid{grid-template-columns:1fr;max-width:480px;margin:0 auto;}
  .section{padding:64px 0;}
  .section-head{margin-bottom:40px;}
  .section-title{letter-spacing:3px;}
  .section-title::before,.section-title::after{width:22px;}
  .detail-block{grid-template-columns:1fr;gap:26px;margin-bottom:52px;}
  .detail-block.reverse .block-media{order:0;}
  .fact-bar{grid-template-columns:1fr;}
  .yun-card{padding:32px 26px;}
  .fortune-card{padding:30px 22px 24px;}
  .yiji{grid-template-columns:1fr;}
  .fortune-head{flex-direction:column;align-items:flex-start;}
  .fortune-level{align-self:flex-start;}
  .footer-grid{grid-template-columns:1fr;gap:28px;}
  .detail-hero{min-height:260px;aspect-ratio:16/10;}
  .home-hero-title{letter-spacing:8px;text-indent:8px;}
}
@media (max-width:375px){
  .container{padding:0 16px;}
  .brand{font-size:18px;letter-spacing:2px;min-height:44px;}
  .btn{padding:13px 24px;}
}

/* ============================================================
   减少动态
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  .reveal{opacity:1;transform:none;}
}
</style>
</head>
<body>
<!-- ============================================================
     顶部导航
     ============================================================ -->
<header class="site-header">
  <div class="container nav-inner">
    <a class="brand" href="#/" data-route="home">
      <span class="brand-seal">蜀</span>
      <span>蜀运成都</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="展开导航菜单" aria-controls="mainNav" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <nav class="main-nav" id="mainNav" aria-label="主导航">
      <a class="nav-link" href="#/" data-nav="home">首页</a>

  var lastFortuneIdx = -1;
  function drawFortune(){
    var idx;
    do { idx = Math.floor(Math.random()*FORTUNES.length); }
    while(FORTUNES.length>1 && idx===lastFortuneIdx);
    lastFortuneIdx = idx;
    var f = FORTUNES[idx];
    document.getElementById("fNo").textContent = f.no;
    document.getElementById("fTitle").textContent = f.title;
    document.getElementById("fLevel").textContent = f.level;
    document.getElementById("fYi").textContent = f.yi;
    document.getElementById("fJi").textContent = f.ji;
    document.getElementById("fTalk").textContent = f.talk;
    document.getElementById("fAdvice").textContent = f.advice;
    var card = document.getElementById("fortuneCard");
    card.hidden = false;
    card.classList.remove("fortune-show");
    void card.offsetWidth;
    if(!reduceMotion){ card.classList.add("fortune-show"); }
    document.getElementById("drawBtn").textContent = "再抽一签";
  }

  var revealObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){ en.target.classList.add("in-view"); revealObserver.unobserve(en.target); }
    });
  },{threshold:.08});

  function afterRender(){
    var revealEls = document.querySelectorAll("#app .reveal");
    if(reduceMotion){ revealEls.forEach(function(el){ el.classList.add("in-view"); }); }
    else { revealEls.forEach(function(el){ revealObserver.observe(el); }); }
    var drawBtn = document.getElementById("drawBtn");
    if(drawBtn){ drawBtn.addEventListener("click", drawFortune); }
  }
  function render(){
    var parts = (location.hash.replace(/^#/,"").split("/").filter(Boolean));
    var app = document.getElementById("app");
    var html, navKey = "home";
    if(parts.length===0){ html = renderHome(); }
    else if(parts[0]==="routes"){ html = renderRoutes(); navKey="routes"; }
    else if(parts[0]==="site" && parts[1]){ html = renderSite(parts[1]); navKey="routes"; }
    else if(parts[0]==="flavor"){ html = renderFlavor(); navKey="flavor"; }
    else if(parts[0]==="taste" && parts[1]){ html = renderTaste(parts[1]); navKey="flavor"; }
    else if(parts[0]==="fortune"){ html = renderFortune(); navKey="fortune"; }
    else { html = renderNotFound(); }
    app.innerHTML = html;
    updateNav(navKey);
    window.scrollTo(0,0);
    afterRender();
  }

  /* ============================================================
     涟漪（事件委托，覆盖所有视图）
     ============================================================ */
  document.addEventListener("pointerdown", function(e){
    var t = e.target.closest(".btn, .nav-link");
    if(!t || t.disabled) return;
    var rect = t.getBoundingClientRect();
    var point = e;
    if(e.touches && e.touches.length){ point = e.touches[0]; }
    var cx = point.clientX!=null ? point.clientX : rect.left+rect.width/2;
    var cy = point.clientY!=null ? point.clientY : rect.top+rect.height/2;
    var size = Math.max(rect.width,rect.height)*1.1;
    var span = document.createElement("span");
    span.className = "ripple";
    span.style.width = span.style.height = size+"px";
    span.style.left = (cx-rect.left-size/2)+"px";
    span.style.top  = (cy-rect.top-size/2)+"px";
    t.appendChild(span);
    span.addEventListener("animationend", function(){ span.remove(); });
  });

  /* ============================================================
     移动端导航
     ============================================================ */
  var navToggle = document.getElementById("navToggle");
  var mainNav = document.getElementById("mainNav");
  navToggle.addEventListener("click", function(){
    var open = mainNav.classList.toggle("open");
    navToggle.setAttribute("aria-expanded", open?"true":"false");
  });
  mainNav.addEventListener("click", function(e){
    if(e.target.closest(".nav-link")){
      mainNav.classList.remove("open");
      navToggle.setAttribute("aria-expanded","false");
    }
  });

  window.addEventListener("hashchange", render);
  if(!location.hash){ location.hash = "#/"; } else { render(); }
})();
</script>
</body>
</html>
